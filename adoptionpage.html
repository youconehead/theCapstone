<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies practice</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <form method="get">
        <label for="firstname">First Name:</label>
        <input type="text" name="firstname" id="firstname" placeholder="First Name">
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname" id="lastname" placeholder="Last Name">
        <p></p>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="name@email.com">
        <label for="password">Password:</label>
        <input type="password" name="password" id="password">
        <p>Are you over the age of 18?</p>
        <label for="yes">Yes:</label>
        <input type="radio" name="yes" id="yes" value="yes">
        <label for="no">No:</label>
        <input type="radio" name="yes" id="no" value="no">
        <p>Do you have a Credit Card or PayPal?</p>
        <select name="payment" id="payment">
            <option value="creditcard">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select>
        <p></p>
        <input type="submit" name="submitted" value="Submit Feedback">


    </form>
</body>

</html>
