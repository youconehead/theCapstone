<body>
<div class="container">

    </div>

<div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://th.bing.com/th/id/R.b569256ba48c779066ced772dee974b0?rik=Sj2NUtnmZzaRbA&pid=ImgRaw&r=0" class="d-block w-100" alt="cheese">

    </div>
    <div class="carousel-item">
      <img src="https://i.makeagif.com/media/4-19-2016/ZfAd1J.gif" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">

  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">

  </button>
</div>
<div class="input-group mb-3">
  <a href="https://media1.tenor.com/m/WCVJtVMOrasAAAAC/bird-tripod.gif"><button class="btn btn-outline-secondary bg-success text-light active btn-sm" type="button">Button 1</button></a>
  <button class="btn btn-outline-secondary bg-danger text-light disabled btn-lg" type="button" >Button 2</button>
  <input type="text" class="form-control" placeholder="there are some buttons" aria-label="Example text with two button addons">
</div>
<form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">did you find it?</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">add email here so i can contact you</div>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">sign up for cheese</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

<div class="accordion" id="accordionPanelsStayOpenExample">

        wat te

      <div class="accordion-body text-center">
        <img src="https://media1.tenor.com/m/WCVJtVMOrasAAAAC/bird-tripod.gif" width="1000" height="300">
      </div>
    </div>
  </div>
</div>
